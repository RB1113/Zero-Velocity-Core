<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZVC – Zero Velocity Core</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #5a00ff, #009dff);
    color: white;
    overflow-x: hidden;
}

/* Pages + transitions */
.page {
    display: none;
    animation: slideIn 0.35s ease;
}
.page.active {
    display: block;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}

/* Navigation */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
}

nav .left {
    display: flex;
    align-items: center;
    gap: 10px;
}

nav h1 {
    margin: 0;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: 0.3s;
}
nav h1:hover {
    transform: scale(1.05);
}

nav .links a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-size: 18px;
    transition: 0.2s;
    cursor: pointer;
}
nav .links a:hover {
    opacity: 0.7;
    transform: scale(1.1);
}

/* Right side: arrows + logo */
nav .right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.arrow-btn {
    background: #ffffff22;
    border: 2px solid white;
    padding: 6px 12px;
    border-radius: 999px;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: 0.25s;
}
.arrow-btn:hover {
    background: white;
    color: #5a00ff;
    transform: translateY(-1px) scale(1.08);
}

/* Logo */
#zvcLogo {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 0 18px rgba(255,255,255,0.7);
    animation: glowPulse 2.4s infinite ease-in-out;
}
@keyframes glowPulse {
    0% { box-shadow: 0 0 8px rgba(255,255,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 22px rgba(255,255,255,0.9); transform: scale(1.05); }
    100% { box-shadow: 0 0 8px rgba(255,255,255,0.4); transform: scale(1); }
}

/* Sections / cards */
.section {
    padding: 40px;
}
.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}
.card:hover {
    transform: scale(1.02);
}

/* Buttons */
button {
    background: #ffffff22;
    border: 2px solid white;
    padding: 10px 20px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: white;
    color: #5a00ff;
    transform: scale(1.1);
}

/* ===== MODERN SOFT-SHINE DIFFICULTY BUTTONS ===== */
.diff-btn {
    padding: 10px 22px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(8px);
    transition: 0.25s ease;
    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.18),
        0 4px 12px rgba(0,0,0,0.25);
}

/* EASY — Soft Green Shine */
.diff-btn.easy {
    border: 2px solid #00ff55;
    box-shadow:
        inset 0 0 10px rgba(0,255,85,0.25),
        0 0 12px rgba(0,255,85,0.20);
}
.diff-btn.easy:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow:
        inset 0 0 16px rgba(0,255,85,0.45),
        0 0 20px rgba(0,255,85,0.35);
}

/* MEDIUM — Soft Yellow Shine */
.diff-btn.medium {
    border: 2px solid #ffe600;
    box-shadow:
        inset 0 0 10px rgba(255,230,0,0.25),
        0 0 12px rgba(255,230,0,0.20);
}
.diff-btn.medium:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow:
        inset 0 0 16px rgba(255,230,0,0.45),
        0 0 20px rgba(255,230,0,0.35);
}

/* HARD — Soft Red Shine */
.diff-btn.hard {
    border: 2px solid #ff2b2b;
    box-shadow:
        inset 0 0 10px rgba(255,43,43,0.25),
        0 0 12px rgba(255,43,43,0.20);
}
.diff-btn.hard:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow:
        inset 0 0 16px rgba(255,43,43,0.45),
        0 0 20px rgba(255,43,43,0.35);
}

/* Targets */
.target {
    width: 50px;
    height: 50px;
    background: #ff3b3b;
    border-radius: 50%;
    position: absolute;
    cursor: pointer;
    transition: 0.1s;
}
.target:hover {
    transform: scale(1.2);
}

/* Game area */
#gameArea {
    position: relative;
    width: 100%;
    height: 400px;
    margin-top: 10px;
    border-radius: 12px;
    background: rgba(0,0,0,0.25);
    overflow: hidden;
}
</style>
</head>

<body>

<nav>
    <div class="left">
        <h1>ZVC</h1>
    </div>

    <div class="links">
        <a onclick="showPage('home')">Home</a>
        <a onclick="showPage('trainer')">Trainer</a>
        <a onclick="showPage('about')">About</a>
    </div>

    <div class="right">
        <button class="arrow-btn" onclick="history.back()">←</button>
        <button class="arrow-btn" onclick="history.forward()">→</button>
    </div>
</nav>

<!-- HOME -->
<div id="home" class="page active section">
    <h2>Welcome to Zero Velocity Core</h2>
    <p>Your reaction, tracking, and micro‑adjustment trainer.</p>
</div>

<!-- TRAINER -->
<div id="trainer" class="page section">
    <h2>Training Module</h2>

    <div style="margin-bottom:20px;">
        <button class="diff-btn easy" onclick="setDifficulty('easy')">Easy</button>
        <button class="diff-btn medium" onclick="setDifficulty('medium')">Medium</button>
        <button class="diff-btn hard" onclick="setDifficulty('hard')">Hard</button>
    </div>

    <button onclick="startTracking()">Start Tracking</button>

    <div id="gameArea"></div>
</div>

<!-- ABOUT -->
<div id="about" class="page section">
    <h2>About Zero Velocity Core</h2>
    <p>Reaction drills, micro‑tweaks, tracking modules, and more.</p>
</div>

<script>
let difficulty = "easy";

function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function setDifficulty(level) {
    difficulty = level;
}

/* TRACKING */
function startTracking() {
    const area = document.getElementById("gameArea");
    area.innerHTML = "";

    const target = document.createElement("div");
    target.className = "target";
    area.appendChild(target);

    let x = 100, y = 100;

    setInterval(() => {
        x += (Math.random() - 0.5) * (difficulty === "hard" ? 60 : difficulty === "medium" ? 40 : 25);
        y += (Math.random() - 0.5) * (difficulty === "hard" ? 60 : difficulty === "medium" ? 40 : 25);

        x = Math.max(0, Math.min(area.offsetWidth - 50, x));
        y = Math.max(0, Math.min(area.offsetHeight - 50, y));

        target.style.left = x + "px";
        target.style.top = y + "px";
    }, 100);
}

/* TWEAKS */
function convertSens() {
    const sens = Number(document.getElementById("sensInput").value);
    document.getElementById("sensOutput").innerText =
        "Converted Sens (x3.18): " + (sens * 3.18).toFixed(2);
}

function calcFOV() {
    const fov = Number(document.getElementById("fovInput").value);
    document.getElementById("fovOutput").innerText =
        "Horizontal FOV: " + (fov * 1.3).toFixed(2);
}
</script>

</body>
</html>
