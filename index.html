<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #5a00ff, #009dff);
    color: white;
    overflow-x: hidden;
}

/* Pages + transitions */
.page {
    display: none;
    animation: slideIn 0.35s ease;
}
.page.active {
    display: block;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}

/* Navigation */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
}

nav .left {
    display: flex;
    align-items: center;
    gap: 10px;
}

nav h1 {
    margin: 0;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: 0.3s;
}
nav h1:hover {
    transform: scale(1.05);
}

nav .links a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-size: 18px;
    transition: 0.2s;
    cursor: pointer;
}
nav .links a:hover {
    opacity: 0.7;
    transform: scale(1.1);
}

/* Right side: arrows + logo */
nav .right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.arrow-btn {
    background: #ffffff22;
    border: 2px solid white;
    padding: 6px 12px;
    border-radius: 999px;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: 0.25s;
}
.arrow-btn:hover {
    background: white;
    color: #5a00ff;
    transform: translateY(-1px) scale(1.08);
}

/* Logo */
#zvcLogo {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 0 18px rgba(255,255,255,0.7);
    animation: glowPulse 2.4s infinite ease-in-out;
}
@keyframes glowPulse {
    0% { box-shadow: 0 0 8px rgba(255,255,255,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 22px rgba(255,255,255,0.9); transform: scale(1.05); }
    100% { box-shadow: 0 0 8px rgba(255,255,255,0.4); transform: scale(1); }
}

/* Sections / cards */
.section {
    padding: 40px;
}
.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}
.card:hover {
    transform: scale(1.02);
}

/* Buttons */
button {
    background: #ffffff22;
    border: 2px solid white;
    padding: 10px 20px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: white;
    color: #5a00ff;
    transform: scale(1.1);
}

/* ===== DIFFICULTY BUTTON COLORS (your request) ===== */
.diff-btn.easy {
    border: 3px solid #00ff00; /* GREEN */
}
.diff-btn.medium {
    border: 3px solid #ffea00; /* YELLOW */
}
.diff-btn.hard {
    border: 3px solid #ff0000; /* RED */
}

/* Targets */
.target {
    width: 50px;
    height: 50px;
    background: #ff3b3b;
    border-radius: 50%;
    position: absolute;
    cursor: pointer;
    transition: 0.1s;
}
.target:hover {
    transform: scale(1.2);
}

/* Game area */
#gameArea {
    position: relative;
    width: 100%;
    height: 400px;
    margin-top: 10px;
    border-radius: 12px;
    background: rgba(0,0,0,0.25);
    overflow: hidden;
}

/* ===== ANIMATED ABOUT PAGE ===== */
.about-hero {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    align-items: center;
}

.about-left {
    flex: 1 1 280px;
}

.about-right {
    flex: 1 1 260px;
    display: grid;
    gap: 15px;
}

.about-pill {
    background: rgba(0,0,0,0.35);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    animation: pillPulse 2s infinite ease-in-out;
}
.about-pill span {
    font-size: 18px;
}

@keyframes pillPulse {
    0% { transform: translateY(0); opacity: 0.9; }
    50% { transform: translateY(-3px); opacity: 1; }
    100% { transform: translateY(0); opacity: 0.9; }
}

.about-core {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px;
    position: relative;
    overflow: hidden;
}
.about-core::before {
    content: "";
    position: absolute;
    inset: -40px;
    background: radial-gradient(circle at 0% 0%, rgba(255,255,255,0.25), transparent 55%);
    opacity: 0.6;
    animation: coreGlow 6s infinite linear;
}
@keyframes coreGlow {
    0% { transform: translate(0,0); }
    50% { transform: translate(40px,20px); }
    100% { transform: translate(0,0); }
}

.about-core h3 {
    margin-top: 0;
}

.about-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.about-card {
    background: rgba(0,0,0,0.35);
    border-radius: 12px;
    padding: 14px;
    position: relative;
    overflow: hidden;
}
.about-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid rgba(255,255,255,0.12);
    opacity: 0;
    transition: 0.3s;
}
.about-card:hover::after {
    opacity: 1;
}
.about-card h4 {
    margin-top: 0;
    margin-bottom: 6px;
}

/* Animated heading */
.about-title {
    font-size: 32px;
    margin-bottom: 10px;
    position: relative;
    display: inline-block;
}
.about-title::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg, #ffffff, transparent);
    animation: underlineSweep 2.5s infinite;
}
@keyframes underlineSweep {
    0% { transform: translateX(-20%); opacity: 0.3; }
    50% { transform: translateX(20%); opacity: 1; }
    100% { transform: translateX(60%); opacity: 0; }
}
</style>
